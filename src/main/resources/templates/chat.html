<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat-Times</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Real-time Chat App</h1>

        <!-- Set Code Section (first user) -->
        <div id="setCodeSection" style="display:none">
            <h5 class="text-center text-muted mb-3">You are the first user! Set a secret code for others to join.</h5>
            <div class="input-group mb-3">
                <input type="password" id="newCode" class="form-control" placeholder="Set a secret code..."/>
                <button class="btn btn-warning" onclick="setCode()">Set Code</button>
            </div>
        </div>

        <!-- Validate Code Section (other users) -->
        <div id="validateCodeSection" style="display:none">
            <h5 class="text-center text-muted mb-3">Enter the secret code to join the chat.</h5>
            <div class="input-group mb-3">
                <input type="password" id="secretCode" class="form-control" placeholder="Enter secret code..."/>
                <button class="btn btn-warning" onclick="validateCode()">Verify</button>
            </div>
            <div id="codeError" class="text-danger mb-2" style="display:none">Invalid secret code!</div>
        </div>

        <!-- Chat Section -->
        <div id="chatSection" style="display:none">
            <div id="chat" class="border rounded p-3 mb-3" style="height: 300px; overflow-y: auto"></div>
            <div class="input-group mb-3">
                <input type="text" id="senderInput" class="form-control" placeholder="Your name..."/>
            </div>
            <div class="input-group mb-3">
                <input type="text" id="messageInput" class="form-control" placeholder="Type a message..."/>
                <div id="input-group-append">
                    <button id="sendMessage" class="btn btn-success" disabled>Send</button>
                </div>
            </div>
            <button id="connectBtn" class="btn btn-primary" onclick="connect()">Connect</button>
        </div>
    </div>
</body>

<script>
    var stompClient = null;

    // Check if code is already set on page load
    window.onload = function () {
        fetch('/isCodeSet')
            .then(function(response) { return response.json(); })
            .then(function(isSet) {
                if (isSet) {
                    document.getElementById('validateCodeSection').style.display = 'block';
                } else {
                    document.getElementById('setCodeSection').style.display = 'block';
                }
            });
    };

    function setCode() {
        var code = document.getElementById('newCode').value;
        if (!code) return;
        fetch('/setCode?code=' + encodeURIComponent(code), { method: 'POST' })
            .then(function(response) { return response.json(); })
            .then(function(success) {
                if (success) {
                    document.getElementById('setCodeSection').style.display = 'none';
                    document.getElementById('chatSection').style.display = 'block';
                }
            });
    }

    function validateCode() {
        var code = document.getElementById('secretCode').value;
        fetch('/validate?code=' + encodeURIComponent(code), { method: 'POST' })
            .then(function(response) { return response.json(); })
            .then(function(valid) {
                if (valid) {
                    document.getElementById('validateCodeSection').style.display = 'none';
                    document.getElementById('chatSection').style.display = 'block';
                } else {
                    document.getElementById('codeError').style.display = 'block';
                }
            });
    }

    function setConnected(connected) {
        document.getElementById("sendMessage").disabled = !connected;
        document.getElementById("connectBtn").disabled = connected;
        document.getElementById("connectBtn").textContent = connected ? "Connected" : "Connect";
    }

    function connect() {
        stompClient = new StompJs.Client({
            webSocketFactory: function () {
                return new SockJS('/chat');
            },
            onConnect: function (frame) {
                setConnected(true);
                stompClient.subscribe('/topic/public', function (message) {
                    showMessage(JSON.parse(message.body));
                });
            },
            onStompError: function (frame) {
                console.error('STOMP error: ' + frame.headers['message']);
            }
        });
        stompClient.activate();
    }

    function showMessage(message) {
        var chat = document.getElementById('chat');
        var messageElement = document.createElement('div');
        messageElement.classList.add('border-bottom', 'mb-1');
        messageElement.textContent = message.sender + ': ' + message.content;
        chat.appendChild(messageElement);
        chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('sendMessage').addEventListener('click', function () {
        var sender = document.getElementById('senderInput').value;
        var content = document.getElementById('messageInput').value;
        if (sender && content) {
            stompClient.publish({
                destination: '/app/sendMessage',
                body: JSON.stringify({ sender: sender, content: content })
            });
            document.getElementById('messageInput').value = '';
        }
    });
</script>
</html>
