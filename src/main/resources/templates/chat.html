<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat-Times</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Real-time Chat App</h1>
        <div id="chat" class="border rounded p-3 mb-3" style="height: 300px; overflow-y: auto">
        </div>
        <div class="input-group mb-3">
            <input type="text" id="senderInput" class="form-control" placeholder="Your name..."/>
        </div>
        <div class="input-group mb-3">
            <input type="text" id="messageInput" class="form-control" placeholder="Type a message..."/>
            <div id="input-group-append">
                <button id="sendMessage" class="btn btn-success" disabled>Send</button>
            </div>
        </div>
        <button id="connectBtn" class="btn btn-primary" onclick="connect()">Connect</button>
    </div>
</body>

<script>
    var stompClient = null;

    function setConnected(connected) {
        document.getElementById("sendMessage").disabled = !connected;
        document.getElementById("connectBtn").disabled = connected;
        document.getElementById("connectBtn").textContent = connected ? "Connected" : "Connect";
    }

    function connect() {
        stompClient = new StompJs.Client({
            webSocketFactory: function () {
                return new SockJS('/chat');
            },
            onConnect: function (frame) {
                setConnected(true);
                stompClient.subscribe('/topic/public', function (message) {
                    showMessage(JSON.parse(message.body));
                });
            },
            onStompError: function (frame) {
                console.error('STOMP error: ' + frame.headers['message']);
            }
        });
        stompClient.activate();
    }

    function showMessage(message) {
        var chat = document.getElementById('chat');
        var messageElement = document.createElement('div');
        messageElement.classList.add('border-bottom', 'mb-1');
        messageElement.textContent = message.sender + ': ' + message.content;
        chat.appendChild(messageElement);
        chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('sendMessage').addEventListener('click', function () {
        var sender = document.getElementById('senderInput').value;
        var content = document.getElementById('messageInput').value;
        if (sender && content) {
            stompClient.publish({
                destination: '/app/sendMessage',
                body: JSON.stringify({ sender: sender, content: content })
            });
            document.getElementById('messageInput').value = '';
        }
    });
</script>
</html>
